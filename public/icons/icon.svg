<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#141d2e"/>
      <stop offset="60%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <!-- Spirit Glow Outer -->
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Orb Core -->
    <radialGradient id="orbGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff3d0"/>
      <stop offset="55%" stop-color="#ffc857"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>

    <!-- Cyan Wisp Glow -->
    <radialGradient id="cyanWisp" cx="60%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>

    <!-- Starburst Filter -->
    <filter id="bloomFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Mystic Pines Silhouette -->
  <g fill="#070a10" opacity="0.85">
    <!-- Far Trees -->
    <path d="M90 440 L120 340 L150 440 Z"/>
    <path d="M140 460 L180 320 L220 460 Z"/>
    <path d="M290 460 L330 310 L370 460 Z"/>
    <path d="M360 450 L395 350 L430 450 Z"/>
  </g>

  <!-- Cyan Atmosphere Layer -->
  <circle cx="280" cy="270" r="190" fill="url(#cyanWisp)"/>

  <!-- Golden Spirit Glow Halo -->
  <circle cx="256" cy="235" r="185" fill="url(#outerGlow)"/>

  <!-- Main Golden Spirit Orb -->
  <g filter="url(#bloomFilter)">
    <circle cx="256" cy="235" r="82" fill="url(#orbGrad)"/>
  </g>

  <!-- Inner Sacred Core -->
  <circle cx="252" cy="225" r="28" fill="#ffffff" opacity="0.95"/>

  <!-- Orbital Spirit Sparks -->
  <circle cx="165" cy="180" r="6" fill="#ffd27a" opacity="0.85"/>
  <circle cx="355" cy="195" r="8" fill="#ffd27a" opacity="0.9"/>
  <circle cx="205" cy="320" r="5" fill="#67e8f9" opacity="0.75"/>
  <circle cx="320" cy="305" r="7" fill="#ffd27a" opacity="0.8"/>
  <circle cx="260" cy="115" r="5" fill="#fff" opacity="0.85"/>

  <!-- Elegant Ground Crest -->
  <path d="M0 430 Q140 405 256 415 T512 430 L512 512 L0 512 Z" fill="#040609"/>
  <path d="M0 450 Q200 440 512 450 L512 512 L0 512 Z" fill="#020305"/>
</svg>
